[package]
name = "vessel-app"
version = "0.1.0-beta.14"
description = "A lightweight, search-first desktop music client"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "vessel-app"

[features]
native-diagnostics = ["dep:objc2-app-kit", "dep:webview2-com"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
libc = "0.2"
libloading = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
time = "0.3"
tauri = { version = "=2.12.5", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSColor", "NSGlassEffectView", "NSVisualEffectView"], optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "=0.1.7"
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "0.62.2", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }
